<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>네이버 리뷰 수집기</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <h1>네이버 리뷰 수집기</h1>

    <div class="search-box">
      <input
        type="text"
        id="keyword"
        placeholder="검색어 입력"
      />

      <button id="searchBtn">
        검색
      </button>
    </div>

    <div id="loading" class="loading hidden">
      수집 중...
    </div>

    <div id="result"></div>

  </div>

  <script src="app.js"></script>

</body>
</html>
